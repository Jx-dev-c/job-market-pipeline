repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

# SQL é validado no CI (`dbt build` de verdade contra um Postgres), não por lint estático:
# o sqlfluff com templater dbt precisaria de uma conexão pra resolver ref()/macros.
