version: 2

models:
  - name: mart_vagas_por_skill
    columns:
      - name: skill_name
        tests:
          - not_null
      - name: job_postings_count
        tests:
          - not_null

  - name: mart_vagas_por_senioridade
    columns:
      - name: seniority_level
        tests:
          - not_null
          - unique

  - name: mart_tendencia_diaria
    columns:
      - name: observed_date
        tests:
          - not_null

  - name: mart_remoto_vs_presencial
    columns:
      - name: work_mode
        tests:
          - not_null
          - unique
